<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Mode</title>
  <link rel="stylesheet" href="bulma.min.css">
  <style>
    /* Styles remain the same */
    #blockedSitesList, #whitelistList {
      max-height: 150px;
      overflow-y: auto;
      padding-right: 10px;
    }
    .site-row {
      display: flex;
      align-items: center;
      padding: 8px 0;
    }
    .site-row:last-child { border-bottom: none; }
    .site-name { flex-grow: 1; text-align: left; margin-right: 10px; font-size: 1rem; }
    .remove-button { font-size: 0.8rem; padding: 4px 8px; }

    /* Additional styles for collapsible panels */
    .panel-block {
      display: block;
    }
    .collapsible {
      cursor: pointer;
      user-select: none;
    }
    .content {
      display: block;
    }
    .content.is-hidden {
      display: none;
    }
  </style>
</head>
<body>
  <section class="section">
    <div class="container">
      <h1 class="title has-text-centered">Focus Mode</h1>
      <p class="subtitle has-text-centered">Stay productive by blocking distractions.</p>

      <div class="notification is-primary" style="display: none;">
        Focus mode is enabled. Distracting sites are now blocked.
      </div>

      <div class="buttons is-centered">
        <button id="toggleFocusMode" class="button is-success">Enable Focus Mode</button>
      </div>

      <!-- Add Site to Block List -->
      <form id="blockSiteForm">
        <div class="field">
          <label class="label" for="siteInput">Add Site to Block List:</label>
          <div class="control">
            <input id="siteInput" class="input" type="text" placeholder="e.g., youtube.com" required pattern="[a-z0-9.-]+\.[a-z]{2,}" aria-describedby="blockListError">
          </div>
        </div>
        <div class="field is-grouped">
          <div class="control">
            <button id="addSite" class="button is-info" type="submit">Add Site</button>
          </div>
          <div class="control">
            <p id="blockListSuccess" class="help is-success" style="display: none;">Site added to block list.</p>
            <p id="blockListError" class="help is-danger" style="display: none;"></p>
          </div>
        </div>
      </form>

      <div class="panel">
        <p class="panel-heading collapsible" id="toggleBlockedSites">Blocked Sites</p>
        <div id="blockedSitesList" class="panel-block is-flex-direction-column content"></div>
      </div>

      <!-- Add Whitelist Section -->
      <form id="whitelistForm">
        <div class="field">
          <label class="label" for="whitelistInput">Add Site to Whitelist:</label>
          <div class="control">
            <input id="whitelistInput" class="input" type="text" placeholder="e.g., YouTube video, playlist, or channel URL" required aria-describedby="whitelistError">
          </div>
        </div>
        <div class="field is-grouped">
          <div class="control">
            <button id="addWhitelistSite" class="button is-success" type="submit">Add to Whitelist</button>
          </div>
          <div class="control">
            <p id="whitelistSuccess" class="help is-success" style="display: none;">Site added to whitelist.</p>
            <p id="whitelistError" class="help is-danger" style="display: none;"></p>
          </div>
        </div>
      </form>

      <div class="panel">
        <p class="panel-heading collapsible" id="toggleWhitelist">Whitelisted Sites</p>
        <div id="whitelistList" class="panel-block is-flex-direction-column content"></div>
      </div>
    </div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
