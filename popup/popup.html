<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Mode</title>
  <link rel="stylesheet" href="bulma.min.css">
  <style>
    /* Styles remain the same */
    #blockedSitesList, #whitelistList {
      max-height: 150px;
      overflow-y: auto;
      padding-right: 10px;
    }
    .site-row {
  display: flex;
  align-items: center;
  padding: 8px 0;
}

    .site-row:last-child { border-bottom: none; }
    .site-name { flex-grow: 1; text-align: left; margin-right: 10px; font-size: 1rem; }
    .remove-button { font-size: 0.8rem; padding: 4px 8px; }
  </style>
</head>
<body>
  <section class="section">
    <div class="container">
      <h1 class="title has-text-centered">Focus Mode</h1>
      <p class="subtitle has-text-centered">Stay productive by blocking distractions.</p>

      <div class="notification is-primary" style="display: none;">
        Focus mode is enabled. Distracting sites are now blocked.
      </div>

      <div class="buttons is-centered">
        <button id="toggleFocusMode" class="button is-success">Enable Focus Mode</button>
      </div>

      <!-- Add Site to Block List -->
      <div class="field">
        <label class="label">Add Site to Block List:</label>
        <div class="control">
          <input id="siteInput" class="input" type="text" placeholder="e.g., youtube.com">
        </div>
        <button id="addSite" class="button is-link">Add Site</button>
      </div>

      <div class="panel">
        <p class="panel-heading">Blocked Sites</p>
        <div id="blockedSitesList" class="panel-block is-flex-direction-column"></div>
      </div>

      <!-- Add Whitelist Section -->
      <div class="field">
        <label class="label">Add Site to Whitelist:</label>
        <div class="control">
          <input id="whitelistInput" class="input" type="text" placeholder="e.g., https://www.youtube.com/watch?v=example">
        </div>
        <button id="addWhitelistSite" class="button is-link">Add to Whitelist</button>
      </div>

      <div class="panel">
        <p class="panel-heading">Whitelisted Sites</p>
        <div id="whitelistList" class="panel-block is-flex-direction-column"></div>
      </div>
    </div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
