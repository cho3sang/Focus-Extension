<svg width="900" height="560" viewBox="0 0 900 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Focus Mode Chrome extension popup preview</title>
  <desc id="desc">A visual preview of the Focus Mode popup with focus mode enabled, blocked sites, and whitelist controls.</desc>
  <rect width="900" height="560" fill="#F4F7FA"/>
  <rect x="70" y="54" width="760" height="452" rx="22" fill="#FFFFFF" stroke="#D8E1EA" stroke-width="2"/>
  <rect x="70" y="54" width="760" height="58" rx="22" fill="#273447"/>
  <circle cx="103" cy="83" r="7" fill="#FF6B6B"/>
  <circle cx="127" cy="83" r="7" fill="#FFD166"/>
  <circle cx="151" cy="83" r="7" fill="#06D6A0"/>
  <text x="450" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Focus Mode</text>

  <rect x="295" y="136" width="310" height="344" rx="16" fill="#FDFEFE" stroke="#D8E1EA"/>
  <text x="450" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1F2937">Focus Mode</text>
  <text x="450" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#667085">Stay productive by blocking distractions.</text>

  <rect x="333" y="224" width="234" height="40" rx="8" fill="#DFF7EA" stroke="#A9E4C4"/>
  <text x="450" y="249" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#087443">Focus mode is enabled</text>

  <rect x="362" y="284" width="176" height="42" rx="8" fill="#E5484D"/>
  <text x="450" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Disable Focus Mode</text>

  <text x="331" y="358" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#344054">Blocked Sites</text>
  <rect x="331" y="370" width="238" height="34" rx="7" fill="#F2F4F7"/>
  <text x="348" y="392" font-family="Arial, sans-serif" font-size="13" fill="#475467">youtube.com</text>
  <rect x="481" y="378" width="70" height="18" rx="5" fill="#FFE2E5"/>
  <text x="516" y="391" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#B42318">Remove</text>

  <text x="331" y="430" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#344054">Whitelist</text>
  <rect x="331" y="442" width="238" height="34" rx="7" fill="#F2F4F7"/>
  <text x="348" y="464" font-family="Arial, sans-serif" font-size="13" fill="#475467">youtube.com/@freecodecamp</text>

  <text x="450" y="528" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#667085">Preview of extension popup and controls</text>
</svg>
